# Configuração do Territory Predictive Insights (lida pelo ConfiguracaoSistema).
# Qualquer chave pode ser sobrescrita na linha de comando: java -Ddb.url=... -jar ...

# Banco H2 em ARQUIVO (pasta ./dados): o histórico sobrevive ao reiniciar o programa.
db.url=jdbc:h2:file:./dados/territorio
db.usuario=sa
db.senha=

# Previsão: tamanho da janela (N leituras) e estratégias ativas (nomes da FabricaPrevisao)
previsao.janela=5
previsao.estrategias=MEDIA_MOVEL,COMPARACAO

# Território monitorado (fictício, sem dados pessoais)
territorio.nome=Bacia do Córrego Água Rasa
territorio.regiao=Zona Leste (território fictício)
territorio.populacao=12800
territorio.domicilios=430
territorio.codigoAcesso=fiap2026

# Limiares por tipo de sensor: ATENÇÃO,ALERTA,CRÍTICO
# Chuva (mm/h): forte a partir de ~10 mm/h, muito forte acima de 30 e extrema acima de 50
limiar.PLUVIOMETRO=10,30,50
# Nível do córrego (m acima do leito): transborda perto de 4,5 m
limiar.NIVEL_CORREGO=2.5,3.5,4.5
# Umidade do solo (%): solo saturado favorece enxurrada e deslizamento
limiar.UMIDADE_SOLO=80,90,97
